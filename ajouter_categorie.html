{% extends 'base.html' %}

{% block title %}Ajouter une catégorie - OASIS{% endblock %}

{% block content %}
<div class="container" style="max-width: 600px; margin: 40px auto;">
    <div style="background: white; padding: 40px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);">
        <h2 style="color: #00897b; margin-bottom: 30px;">🏷️ Ajouter une catégorie</h2>
        
        <form method="POST">
            {% csrf_token %}
            <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px; font-weight: 500;">Nom de la catégorie *</label>
                <input type="text" name="nom" required placeholder="Ex: Résidence, Spa, Centre commercial..." 
                       style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px;">
            </div>
            <div style="margin-bottom: 20px;">
                <label style="display: block; margin-bottom: 5px; font-weight: 500;">Description</label>
                <textarea name="description" rows="4" placeholder="Description de la catégorie..." 
                          style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px;"></textarea>
            </div>
            <button type="submit" style="width: 100%; padding: 14px; background: #00897b; color: white; border: none; border-radius: 8px; font-size: 18px; cursor: pointer;">
                ➕ Créer la catégorie
            </button>
        </form>
        
        <p style="text-align: center; margin-top: 20px;">
            <a href="/dashboard/" style="color: #00897b; text-decoration: none;">← Retour au dashboard</a>
        </p>
    </div>
</div>
{% endblock %}
