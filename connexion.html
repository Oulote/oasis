{% extends 'base.html' %}

{% block title %}Connexion - OASIS{% endblock %}

{% block content %}
<div class="container" style="max-width: 500px; margin: 60px auto;">
    <div style="background: white; padding: 40px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);">
        <h2 style="text-align: center; color: #00897b; margin-bottom: 30px;">🔐 Connexion</h2>
        
        <form method="POST">
            {% csrf_token %}
            <div style="margin-bottom: 20px;">
                <label style="display: block; margin-bottom: 8px; font-weight: 500;">Numéro de téléphone</label>
                <input type="tel" name="telephone" placeholder="Ex: 05 00 00 00 00" 
                       style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px;">
            </div>
            <div style="margin-bottom: 20px;">
                <label style="display: block; margin-bottom: 8px; font-weight: 500;">Mot de passe</label>
                <input type="password" name="mot_de_passe" placeholder="Votre mot de passe" 
                       style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px;">
            </div>
            <button type="submit" 
                    style="width: 100%; padding: 14px; background: #00897b; color: white; border: none; border-radius: 8px; font-size: 18px; cursor: pointer;">
                Se connecter
            </button>
        </form>
        
        <p style="text-align: center; margin-top: 20px; color: #666;">
            Pas encore de compte ? <a href="/inscription/" style="color: #00897b; text-decoration: none; font-weight: 500;">Inscrivez-vous</a>
        </p>
    </div>
</div>
{% endblock %}
